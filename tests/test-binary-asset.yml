name: Test upload binary release asset
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test binary asset (zip file)
        run: |
          echo "binary content" > /tmp/test-content.txt
          zip /tmp/test-release.zip /tmp/test-content.txt

      - id: upload
        uses: .
        continue-on-error: true
        with:
          upload_url: "https://uploads.github.com/repos/actionchain-harness/fake-repo/releases/1/assets{?name,label}"
          asset_path: /tmp/test-release.zip
          asset_name: test-release.zip
          asset_content_type: application/zip

      - name: Assert action ran (upload fails gracefully on sentinel/fake repo)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          DOWNLOAD_URL: ${{ steps.upload.outputs.browser_download_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "browser_download_url: $DOWNLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "FAIL: action succeeded but browser_download_url is empty"
              exit 1
            fi
            echo "PASS: upload succeeded with download URL: $DOWNLOAD_URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel/fake repo upload URL is not valid)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
